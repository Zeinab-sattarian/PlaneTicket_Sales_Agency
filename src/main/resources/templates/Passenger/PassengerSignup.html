<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="ISO-8859-1">
    <title>Plane Ticket Agency</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.0.0/dist/css/bootstrap.min.css" integrity="sha384-Gn5384xqQ1aoWXA+058RXPxPg6fy4IWvTNh0E263XmFcJlSAwiGgFAW/dAiS6JXm" crossorigin="anonymous">
    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>
<body>
<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <h2 class="text-center">Passenger Signup</h2>
            <div class="panel panel-info">
                <div class="panel-heading">
                    <div class="panel-title">Create New Account</div>
                </div>
                <div class="panel-body">
                    <form th:action="@{signup}" th:object="${passenger}" enctype="multipart/form-data" method="post">
                        <div class="form-group row">
                            <label for="firstname" class="col-md-3 col-form-label">
                                First Name</label>
                            <div class="col-md-9">
                                <input th:field="*{firstName}" id="firstname" class="form-control"  required/>
                            </div>
                        </div>
                        <div class="form-group row">
                            <label for="lastname" class="col-md-3 col-form-label">
                                Last Name</label>
                            <div class="col-md-9">
                                <input th:field="*{lastName}" id="lastname" class="form-control" required/>
                            </div>
                        </div>
                        <div class="form-group row">
                            <label for="username" class="col-md-3 col-form-label">
                                Username</label>
                            <div class="col-md-9">
                                <input th:field="*{username}" id="username" class="form-control" required/>
                            </div>
                        </div>
                        <div class="form-group row">
                            <label for="password" class="col-md-3 col-form-label">
                                Password </label>
                            <div class="col-md-9">
                                <input type="password" th:field="*{password}" id="password" placeholder="8 Characters Or More" class="form-control" pattern=".{8,}" required/>
                            </div>
                        </div>
                        <div class="form-group row">
                            <label for="phoneNumber" class="col-md-3 col-form-label">
                                Phone Number</label>
                            <div class="col-md-9">
                                <input type="text" th:field="*{phoneNumber}" id="phoneNumber" placeholder="09000000000" class="form-control" pattern="09[0-9]{9}" required/>
                            </div>
                        </div>
                        <div class="form-group row">
                            <label for="email" class="col-md-3 col-form-label">
                                Email</label>
                            <div class="col-md-9">
                                <input type="email" th:field="*{email}" id="email" class="form-control" required/>
                            </div>
                        </div>
                        <div class="form-group row">
                            <label for="ssn" class="col-md-3 col-form-label">
                                Social Security Number</label>
                            <div class="col-md-9">
                                <input th:field="*{ssn}" id="ssn" class="form-control" pattern="[0-9]{8,10}" required/>
                            </div>
                        </div>
                        <div class="form-group row">
                            <label for="profilePic" class="col-md-3 col-form-label">Profile Picture</label>
                            <div class="col-md-9">
                                <input name="profilePic" id="profilePic" type="file" class="form-control" />
                            </div>
                        </div>
                        <div class="form-group row">
                            <div class="col-md-9 offset-md-3">
                                <button class="btn btn-primary">Submit</button>
                            </div>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
