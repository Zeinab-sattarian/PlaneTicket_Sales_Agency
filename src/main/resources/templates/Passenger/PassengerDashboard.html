
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="ISO-8859-1">
    <title>Plane Ticket Agency</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.0.0/dist/css/bootstrap.min.css" integrity="sha384-Gn5384xqQ1aoWXA+058RXPxPg6fy4IWvTNh0E263XmFcJlSAwiGgFAW/dAiS6JXm" crossorigin="anonymous">
    <link th:href="@{/css/style.css}" rel="stylesheet">


</head>
<body>

<div class="container">

    <div class="row bg-info p-3 rounded">

        <div class="col">

            <h4>PASSENGER</h4>

        </div>
        <div class="col d-flex justify-content-end">
            <h4 th:text="${loggedInPassenger.username}">
            </h4>
        </div>
    </div>
    <div class=" w-100 mt-3">
        <button class="btn btn-info w-100" type="button" data-bs-toggle="collapse" data-bs-target="#profileCollapse" aria-expanded="false" aria-controls="profileCollapse">
            View Profile
        </button>
        
        <div class="collapse" id="profileCollapse">
            <div class="card card-body mt-2">
                <div class="row bg-info p-3 rounded">
                    <div class="col-9">
                        <div class="row mb-2">
                            <p class="mb-0">
                                first name: <span th:text="${loggedInPassenger.firstName}"></span>
                            </p>
                        </div>  
                        <div class="row mb-2">
                            <p class="mb-0">
                                last name: <span th:text="${loggedInPassenger.lastName}"></span>
                            </p>
                        </div>  
                        <div class="row mb-2">
                            <p class="mb-0">
                                email: <span th:text="${loggedInPassenger.email}"></span>
                            </p>
                        </div>  
                        <div class="row mb-2">
                            <p class="mb-0">
                                ssn: <span th:text="${loggedInPassenger.ssn}"></span>
                            </p>
                        </div>
                        <div class="row mb-2">
                            <p class="mb-0">
                                phoneNumber: <span th:text="${loggedInPassenger.phoneNumber}"></span>
                            </p>
                        </div>
                    </div>
                    <div class="col-3">
                        <div class="d-flex justify-content-end align-items-center h-100">            
                            <img th:src="@{${profilePicPath} ?: '/profile/default_profile.jpg'}" alt="Profile Picture" 
                                 class="rounded-circle"
                                 style="width: 100px; height: 100px; object-fit: cover;">
                        </div>
                    </div>
                </div>


            </div>
        </div>
    </div>

    <br>

    <a href="/passenger/dashboard/buy-ticket" class="btn btn-primary btn-block active" role="button" aria-pressed="true">Buy Ticket</a>

    <a href="/passenger/dashboard/view-tickets" class="btn btn-primary btn-block active" role="button" aria-pressed="true">View Tickets</a>

    <br>

    <a href="/passenger/logout" class="btn btn-outline-secondary btn-sm active" role="button" aria-pressed="true">logout</a>



</div>

<script th:src="@{js/jquery-1.11.1.min.js}"></script>
<script th:src="@{js/bootstrap.min.js}"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
