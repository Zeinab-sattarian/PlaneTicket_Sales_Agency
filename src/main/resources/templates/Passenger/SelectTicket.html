
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="ISO-8859-1">
    <title>Plane Ticket Agency</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.0.0/dist/css/bootstrap.min.css" integrity="sha384-Gn5384xqQ1aoWXA+058RXPxPg6fy4IWvTNh0E263XmFcJlSAwiGgFAW/dAiS6JXm" crossorigin="anonymous">
    <link th:href="@{/css/style.css}" rel="stylesheet">


</head>
<body>
<div class="container">
    <div class="col-md-offset-2 col-md-12">
        <h2 class="text-center">Available Flights</h2>
        <div class="panel panel-info">
            <div class="panel-heading">
            </div>

            <div class="panel-body">

                <div class="container overflow-auto">

                    <form method="post" th:action="@{submit-ticket}">
                        <div class="row">

                            <div class="col-lg-2">Origin</div>
                            <div class="col-lg-2">Destination</div>
                            <div class="col-lg-2">Airline</div>
                            <div class="col-lg-1">Departure Time</div>
                            <div class="col-lg-1">Available Seats</div>
                            <div class="col-lg-2">Price</div>
                            <div class="col-lg-2">Select</div>

                        </div>

                    
                        <div th:each="flight: ${foundFlights}" class=" row">
                            <div class="col-lg-2" th:text="${flight.origin}"></div>
                            <div class="col-lg-2" th:text="${flight.destination}"></div>
                            <div class="col-lg-2" th:text="${flight.airline}"></div>
                            <div class="col-lg-1" th:text="${flight.departureTime}"></div>
                            <div class="col-lg-1" th:text="${flight.availableSeats}"></div>
                            <div class="col-lg-2" th:text="${flight.price}"></div>
                            <div class="col-lg-2">
                                <button type="submit" name="selectedFlight" th:value="${flight.id}" th:attr="disabled=${flight.departureDate <= todayDate || flight.availableSeats <= 0 } ">Buy</button>
                            </div>    
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<script th:src="@{js/jquery-1.11.1.min.js}"></script>
<script th:src="@{js/bootstrap.min.js}"></script>
</body>
</html>
