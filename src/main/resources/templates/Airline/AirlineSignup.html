<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="ISO-8859-1">
    <title>Plane Ticket Agency</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.0.0/dist/css/bootstrap.min.css" integrity="sha384-Gn5384xqQ1aoWXA+058RXPxPg6fy4IWvTNh0E263XmFcJlSAwiGgFAW/dAiS6JXm" crossorigin="anonymous">
    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>
<body>
<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <h2 class="text-center">Airline Signup</h2>
            <div class="panel panel-info">
                <div class="panel-heading">
                    <div class="panel-title">Add Airline</div>
                </div>
                <div class="panel-body">
                    <form th:action="@{signup}" method="post" enctype="multipart/form-data" th:object="${Airline}">
                        <div class="form-group row">
                            <label for="name" class="col-md-3 col-form-label">Name</label>
                            <div class="col-md-9">
                                <input th:field="*{name}" id="name" class="form-control" />
                            </div>
                        </div>
                        <div class="form-group row">
                            <label for="callSign" class="col-md-3 col-form-label">Call Sign</label>
                            <div class="col-md-9">
                                <input th:field="*{callSign}" id="callSign" class="form-control" />
                            </div>
                        </div>
                        <div class="form-group row">
                            <label for="hub" class="col-md-3 col-form-label">Hub</label>
                            <div class="col-md-9">
                                <input th:field="*{hub}" id="hub" class="form-control" />
                            </div>
                        </div>
                        <div class="form-group row">
                            <label for="password" class="col-md-3 col-form-label">Password</label>
                            <div class="col-md-9">
                                <input type="password" th:field="*{password}" id="password" placeholder="8 Characters Or More" class="form-control" pattern=".{8,}" required/>
                            </div>
                        <div class="form-group row">
                            <label for="logo" class="col-md-3 col-form-label">Airline Logo</label>
                            <div class="col-md-9">
                                <input name="logo" id="logo" type="file" class="form-control" />
                            </div>
                        </div>
                        <div class="form-group row">
                            <div class="col-md-9 offset-md-3">
                                <button class="btn btn-primary">Submit</button>
                            </div>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
<script th:src="@{js/jquery-1.11.1.min.js}"></script>
<script th:src="@{js/bootstrap.min.js}"></script>
</body>
</html>
