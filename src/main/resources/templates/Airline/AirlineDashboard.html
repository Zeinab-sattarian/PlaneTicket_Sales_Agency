<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="ISO-8859-1">
    <title>Plane Ticket Agency</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.0.0/dist/css/bootstrap.min.css" integrity="sha384-Gn5384xqQ1aoWXA+058RXPxPg6fy4IWvTNh0E263XmFcJlSAwiGgFAW/dAiS6JXm" crossorigin="anonymous">
    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>
<body>

    <div class="container">

        <div class="row bg-info p-3 rounded">
            <div class="col">
                <h4>Airline</h4>
            </div>
            <div class="col d-flex justify-content-end">
                <h4>
                    <span th:text="${loggedInAirline.name}"></span>
                </h4>
            </div>
        </div>
    
        <div class="w-100 mt-3">
            <button class="btn btn-info w-100" type="button" data-bs-toggle="collapse" data-bs-target="#profileCollapse" aria-expanded="false" aria-controls="profileCollapse">
                View Profile
            </button>
            
            <div class="collapse" id="profileCollapse">
                <div class="card card-body mt-2">
                    <div class="row bg-info p-3 rounded">
                        <div class="col-9">
                            <div class="row mb-2">
                                <p class="mb-0">
                                    call sign: <span th:text="${loggedInAirline.callSign}"></span>
                                </p>
                            </div>  
                            <div class="row mb-2">
                                <p class="mb-0">
                                    hub: <span th:text="${loggedInAirline.hub}"></span>
                                </p>
                            </div>  
                        </div>
                        <div class="col-3">
                            <div class="d-flex justify-content-end align-items-center h-100">
                                <img th:src="@{${logoPath} ?: '/airlines/default_airline.jpg'}" alt="Airline Logo" 
                                     class="rounded-circle"
                                     style="width: 100px; height: 100px; object-fit: cover;">
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    
        <a href="/Airline/dashboard/create-flight" class="btn btn-primary btn-block active mt-3" role="button" aria-pressed="true">Add Flight</a>
        <a href="/Airline/dashboard/cancel-flights" class="btn btn-primary btn-block active mt-3" role="button" aria-pressed="true">Cancel A Flight</a>
        <a href="/Airline/dashboard/search-flight" class="btn btn-primary btn-block active mt-3" role="button" aria-pressed="true">Search All Flights</a>
        <a href="/Airline/dashboard/search-ticket" class="btn btn-primary btn-block active mt-3" role="button" aria-pressed="true">Search Tickets</a>
        <br>
    
        <a href="/Airline/logout" class="btn btn-outline-secondary btn-sm active mt-3" role="button" aria-pressed="true">logout</a>
    
    </div>
    
    <script th:src="@{js/jquery-1.11.1.min.js}"></script>
    <script th:src="@{js/bootstrap.min.js}"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    </body>
    </html>
