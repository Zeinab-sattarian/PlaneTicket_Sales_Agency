
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="ISO-8859-1">
    <title>Plane Ticket Agency</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.0.0/dist/css/bootstrap.min.css" integrity="sha384-Gn5384xqQ1aoWXA+058RXPxPg6fy4IWvTNh0E263XmFcJlSAwiGgFAW/dAiS6JXm" crossorigin="anonymous">
    <link th:href="@{/css/style.css}" rel="stylesheet">


</head>
<body>
<div class="container">
    <div class="col-md-offset-2">
        <h2 class="text-center">Results</h2>
        <div class="panel panel-info">
            <div class="panel-heading">
            </div>
            <div class="panel-body">

                <div class="container overflow-auto">

                    <form method="post" th:action="@{show-tickets}">
                        <div class="row">

                            <div class="col-lg-2">Origin</div>
                            <div class="col-lg-2">Destination</div>
                            <div class="col-lg-2">Airline</div>
                            <div class="col-lg-2">Date</div>
                            <div class="col-lg-1">Time</div>
                            <div class="col-lg-1">Passenger Username</div>
                            <div class="col-lg-2">Select</div>

                        </div>

                    
                        <div th:each="ticket: ${tickets}" class=" row">
                            <div class="col-lg-2" th:text="${ticket.flightDTO.origin}"></div>
                            <div class="col-lg-2" th:text="${ticket.flightDTO.destination}"></div>
                            <div class="col-lg-2" th:text="${ticket.flightDTO.Airline}"></div>
                            <div class="col-lg-2" th:text="${ticket.flightDTO.departureDate}"></div>
                            <div class="col-lg-1" th:text="${ticket.flightDTO.departureTime}"></div>
                            <div class="col-lg-1 overflow-auto" th:text="${ticket.passengerDTO.username}"></div>
                            <div class="col-lg-2">
                                <button type="submit" name="selectedTicket" th:value="${ticket.id}">Refund</button>
                            </div>
                        </div>
                    </form>

                </div>

                <br>

                <a href="/passenger/login" class="btn btn-outline-secondary btn-sm active" role="button" aria-pressed="true" methods="post">return</a>

            </div>
        </div>
    </div>
</div>

<script th:src="@{js/jquery-1.11.1.min.js}"></script>
<script th:src="@{js/bootstrap.min.js}"></script>
</body>
</html>
